name: Next.js CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js Environment
      uses: actions/setup-node@v3
      with:
        node-size: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Build Audit
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1
